name: Repository policy

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate repository docs and diff
        shell: bash
        run: |
          set -euo pipefail

          required_paths=(
            README.md
            LICENSE
            CONTRIBUTING.md
            ROADMAP.md
            SECURITY.md
            docs/DEVELOPER_GUIDE.md
            docs/planning/README.md
            .github/BRANCH_POLICY.md
            .github/PULL_REQUEST_TEMPLATE.md
            .github/labels.yml
            .github/ISSUE_TEMPLATE/config.yml
            .github/ISSUE_TEMPLATE/bug-report.yml
            .github/ISSUE_TEMPLATE/feature-request.yml
            .github/ISSUE_TEMPLATE/chain-integration.yml
            .github/ISSUE_TEMPLATE/documentation.yml
            .github/ISSUE_TEMPLATE/planning.yml
            .agents/skills/oneshot-arc-payment/SKILL.md
            scripts/sync-github-labels.mjs
          )

          for path in "${required_paths[@]}"; do
            test -f "$path" || { echo "Missing required file: $path"; exit 1; }
          done

          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!*.lock'; then
            echo 'Unresolved merge marker found.'
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            git diff --check "$base_sha" HEAD
          else
            git diff --check HEAD^
          fi
