name: Feature request
description: A product change that preserves one settlement per business intent.
title: '[Feature]: '
labels:
  - type:feature
  - status:needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who hits this, and what fails today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: The result for the operator or agent. Implementation detail can stay light.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: invariant
    attributes:
      label: Settlement invariant
      description: One business intent still has at most one committed settlement.
      options:
        - Unchanged. This does not add a payment path.
        - Touches payment or retry behavior and must keep the invariant.
        - Unsure. Needs a design note before implementation.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Out of scope
      description: What this request should not change.
    validations:
      required: true
