<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="OneShot is settlement infrastructure for companies whose agents pay in USDC. One approved obligation settles once. The operator selects the rail."
    />
    <link rel="icon" type="image/png" href="/logo.png?v=2" />
    <link
      rel="preload"
      href="/fonts/InterVariable-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/JetBrainsMono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>OneShot — Settlement infrastructure for agent payments</title>
    <style>
      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url('/fonts/InterVariable-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'JetBrains Mono';
        font-style: normal;
        font-weight: 100 800;
        font-display: block;
        src: url('/fonts/JetBrainsMono-latin.woff2') format('woff2');
      }
    </style>
    <script>
      // Stamp the theme before first paint so no frame renders in the wrong
      // palette. Mirrors apps/web/src/theme.ts; keep the two in step.
      (function () {
        var theme = 'dark';
        try {
          var stored = window.localStorage.getItem('oneshot.theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (error) {
          // Site data unavailable; the default stands.
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
