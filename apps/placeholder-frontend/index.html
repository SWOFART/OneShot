<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d10" />
    <title>OneShot — reliable agent payments</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #0b0d10;
        color: #f6f7f9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 10%, #20384a 0, transparent 35%),
          radial-gradient(circle at 85% 80%, #35254b 0, transparent 32%), #0b0d10;
      }

      main {
        width: min(680px, calc(100% - 40px));
        padding: clamp(32px, 7vw, 72px);
        border: 1px solid #ffffff1f;
        border-radius: 28px;
        background: #11151bd9;
        box-shadow: 0 30px 90px #0009;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 32px;
        color: #aeb8c7;
        font-size: 14px;
      }

      .status::before {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: #78e6b1;
        box-shadow: 0 0 18px #78e6b1;
        content: '';
      }

      h1 {
        margin: 0;
        font-size: clamp(48px, 12vw, 92px);
        line-height: 0.9;
        letter-spacing: -0.07em;
      }

      p {
        max-width: 520px;
        margin: 28px 0 0;
        color: #b9c1cd;
        font-size: clamp(18px, 3vw, 23px);
        line-height: 1.5;
      }

      strong {
        color: #fff;
        font-weight: 650;
      }

      footer {
        margin-top: 48px;
        color: #7f8998;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status">Building on Arc Testnet</div>
      <h1>OneShot</h1>
      <p>
        Reliable payments for autonomous agents.
        <strong>One intent, at most one settlement.</strong>
      </p>
      <footer>Arc · Privy · The Graph</footer>
    </main>
  </body>
</html>
